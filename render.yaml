services:
  - type: web
    name: jlpt-coach
    env: node
    region: oregon
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma db push && npm run build && npm run db:seed
    startCommand: node .next/standalone/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jlpt-coach-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

databases:
  - name: jlpt-coach-db
    databaseName: jlpt_coach
    user: jlpt_user
    plan: free
    region: oregon
